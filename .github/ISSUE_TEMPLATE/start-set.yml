name: Start a new classical set
description: Propose a new public-source translation and illustration set.
title: "Start set: "
labels: ["new-set"]
body:
  - type: input
    id: work
    attributes:
      label: Work
      description: Title and original-language title.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public source URL
      description: Link to a public source text, catalog page, or raw source.
    validations:
      required: true
  - type: dropdown
    id: chunk_percent
    attributes:
      label: Chunk size
      options:
        - "0.1%"
        - "0.05%"
        - "0.025%"
        - "0.01%"
    validations:
      required: true
  - type: textarea
    id: aesthetic
    attributes:
      label: Illustration aesthetic
      description: Character consistency, palette, composition, and exclusions.
    validations:
      required: true

